name: Android build
on:
  push:
    branches: [main, feature/android]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MSBuildEnableWorkloadResolver: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update
      - name: Check shared behavior
        run: dotnet run --project SlickWatch.Tests -c Release
      - name: Install SDK dependencies
        run: dotnet build SlickWatch.Android -t:InstallAndroidDependencies -p:MSBuildEnableWorkloadResolver=true -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSdkLicenses=True
      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./build-android.ps1 -Configuration Debug
      - name: Build signed preview APK
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force .local/android-signing | Out-Null
          [IO.File]::WriteAllBytes("$PWD/.local/android-signing/release.jks", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          [IO.File]::WriteAllText("$PWD/.local/android-signing/password.txt", $env:ANDROID_KEYSTORE_PASSWORD)
          ./build-android.ps1 -KeyStore .local/android-signing/release.jks -PasswordFile .local/android-signing/password.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SlickWatch-android-arm64
          path: artifacts/SlickWatch-android-arm64.apk
          if-no-files-found: error
      - name: Build Release APK for emulator verification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local/android-smoke | Out-Null
          [IO.File]::WriteAllText("$PWD/.local/android-smoke/password.txt", 'android-test-only')
          & keytool -genkeypair -keystore .local/android-smoke/test.jks -storepass:file .local/android-smoke/password.txt -keypass:file .local/android-smoke/password.txt -alias slickwatch -keyalg RSA -validity 30 -dname 'CN=SlickWatch CI'
          if ($LASTEXITCODE -ne 0) { throw 'Test key generation failed' }
          ./build-android.ps1 -RuntimeIdentifier android-x64 -KeyStore .local/android-smoke/test.jks -PasswordFile .local/android-smoke/password.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Release startup and reopening
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 packaging/android/verify-release.py artifacts/SlickWatch-android-x64.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-release-checks
          path: work/android-smoke/
          if-no-files-found: warn
